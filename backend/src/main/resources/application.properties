spring.application.name=powerspike-backend

# Las API keys se cargan desde el archivo .env (buscado subiendo directorios
# desde el working directory, ver PowerspikeBackendApplication.loadDotEnv())
# o desde variables de entorno del sistema (útil para el deploy en la nube).
riot.api.key=${RIOT_API_KEY}
riot.platform-url=https://la2.api.riotgames.com
riot.account-url=https://americas.api.riotgames.com
server.port=8080
openai.api.key=${OPENAI_API_KEY}
openai.tts.enabled=false
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/powerspike}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:720}

