# Perfil de producción: se activa con --spring.profiles.active=prod (o SPRING_PROFILES_ACTIVE=prod)
# El resto de la config (DB, keys, JWT) viene de variables de entorno del sistema
# (systemd EnvironmentFile en la VM de AWS).

spring.jpa.show-sql=false

# Datasource: declarado aquí también para que, con el perfil prod activo, Spring
# resuelva correctamente la URL/usuario/password y el driver sin fallar.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/powerspike}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Logging: logback-spring.xml ya define el appender FILE para prod (leído por CloudWatch).
# Nivel por defecto en prod es INFO.
